[project]
name = "aiml-sprint"
version = "0.1.0"
description = "14-day AI Engineering sprint — Python edition. Builds LLM apps with the Vercel-AI-SDK-equivalent Python stack (openai, instructor, pydantic, httpx)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.37.0",
    "python-dotenv>=1.2.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
